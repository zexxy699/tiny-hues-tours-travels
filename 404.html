<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Tiny Hues Tours &amp; Travels</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/assets/tiny-hues-logo.png" type="image/png" />
  <style>
    .nf-main{background:var(--pale,#f3f8f9);padding:90px 0 110px;min-height:calc(100vh - 82px)}
    .nf-box{max-width:620px;margin:0 auto;text-align:center}
    .nf-box h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-.03em;margin:14px 0 16px;color:var(--ink)}
    .nf-box h1 em{font-style:italic;color:#83b4ab}
    .nf-box>p{margin:0 auto;max-width:460px;color:#4c6573;font-size:16px;line-height:1.7}
    .nf-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
    .nf-list-wrap{margin-top:54px;text-align:left}
    .nf-list-wrap[hidden]{display:none}
    .nf-list-title{display:block;margin-bottom:12px;text-align:center}
    .nf-list{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line,#dbe6e9);border-radius:10px;overflow:hidden}
    .nf-list li+li{border-top:1px solid var(--line,#dbe6e9)}
    .nf-link{display:flex;align-items:center;gap:14px;padding:16px 20px;color:var(--ink)}
    .nf-link:hover{background:#f7fbfb}
    .nf-link-title{flex:1;font-family:'Newsreader',Georgia,serif;font-size:20px}
    .nf-link-meta{font-size:13px;color:#5d7380;white-space:nowrap}
    .nf-help{margin-top:26px;text-align:center;font-size:14px;color:#4c6573}
    .nf-help a{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
    @media(max-width:720px){
      .nf-main{padding:56px 0 80px}
      .nf-box h1{font-size:38px}
      .nf-actions .button{width:100%}
      .nf-link{flex-wrap:wrap;gap:4px 12px;padding:14px 16px}
      .nf-link-title{flex-basis:calc(100% - 30px);font-size:18px}
      .nf-link .icon{order:2}
      .nf-link-meta{order:3;width:100%}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/" aria-label="Tiny Hues home">
        <span class="brand-logo"><img src="/assets/tiny-hues-logo.png" alt="Tiny Hues Tours & Travels logo"></span>
        <span class="brand-copy"><strong>TINY HUES</strong><small>TOURS & TRAVELS</small></span>
      </a>
    </div>
  </header>

  <main class="nf-main">
    <div class="container nf-box">
      <span class="kicker">PAGE NOT FOUND</span>
      <h1>This page has <em>wandered off.</em></h1>
      <p>The link may be old or mistyped. Everything else is right where it was.</p>
      <div class="nf-actions">
        <a class="button button-dark" href="/">Back to homepage <span class="icon icon-arrow" aria-hidden="true"></span></a>
        <a class="button button-outline" href="/#packages">See all journeys</a>
      </div>
      <div class="nf-list-wrap" id="nfListWrap">
        <span class="kicker nf-list-title">POPULAR JOURNEYS</span>
        <ul class="nf-list" id="notFoundJourneys"><!--journeys--></ul>
      </div>
      <p class="nf-help">Need help? <a href="https://wa.me/916006473963" target="_blank" rel="noreferrer">Chat with us on WhatsApp</a></p>
    </div>
  </main>

  <script src="/render.js"></script>
  <script>
    // Unknown addresses get this static page: fill the journey list in the browser.
    (function () {
      var list = document.getElementById('notFoundJourneys');
      var wrap = document.getElementById('nfListWrap');
      if (!list || list.querySelector('li')) return;
      function hide() { wrap.hidden = true; }
      if (!window.TinyHuesRender) return hide();
      fetch('/api/content').then(function (r) { return r.ok ? r.json() : null; }).then(function (result) {
        var picks = window.TinyHuesRender.suggestedJourneys((result && result.content && result.content.packages) || [], 4);
        if (picks.length) list.innerHTML = window.TinyHuesRender.notFoundLinksHtml(picks); else hide();
      }).catch(hide);
    }());
  </script>
</body>
</html>
